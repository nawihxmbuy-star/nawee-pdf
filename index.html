<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nawee PDF Studio</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@0.0.4/dist/fontkit.umd.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="top-bar">
        <div class="brand">
            <i class="fa-solid fa-file-signature text-glow"></i>
            <span>Nawee PDF <small class="pro-badge">PRO</small></span>
        </div>
        <div class="action-buttons">
            <button onclick="resetApp()" class="btn-secondary" title="เริ่มเอกสารใหม่">
                <i class="fa-solid fa-rotate-left"></i> <span class="btn-text">เริ่มใหม่</span>
            </button>
            <button onclick="document.getElementById('upload-pdf').click()" class="btn-secondary" title="เปิดไฟล์ PDF">
                <i class="fa-solid fa-folder-open"></i> <span class="btn-text">เปิดไฟล์</span>
            </button>
            <button onclick="exportVectorPDF()" class="btn-primary" title="บันทึก PDF เวกเตอร์แท้ คมชัด 100%">
                <i class="fa-solid fa-arrow-down-to-bracket"></i> <span class="btn-text">ส่งออก PDF</span>
            </button>
        </div>
    </header>

    <input type="file" id="upload-pdf" accept="application/pdf" style="display:none;">

    <main class="workspace">
        <div id="document-container">
            <div class="welcome-box">
                <div class="welcome-icon"><i class="fa-solid fa-file-pdf"></i></div>
                <h2>ยินดีต้อนรับสู่ Nawee PDF Studio</h2>
                <p>โปรแกรมแก้ไขเอกสาร PDF แบบแนบเนียน ลากคลุมลบคำผิด เซ็นลายเซ็น และส่งออกไฟล์คมกริบ</p>
                <button onclick="document.getElementById('upload-pdf').click()" class="btn-open-file">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i> เลือกไฟล์ PDF เพื่อเริ่มงาน
                </button>
            </div>
        </div>
    </main>

    <nav class="floating-dock">
        <button onclick="setTool('pan')" id="tool-pan" class="dock-btn" title="เลื่อนดูเอกสาร">
            <i class="fa-solid fa-hand"></i>
        </button>
        <div class="dock-divider"></div>

        <button onclick="setTool('patch')" id="tool-patch" class="dock-btn active" title="ลากคลุมลบคำผิดและพิมพ์ทับ (ดูดสีพื้นหลังอัตโนมัติ)">
            <i class="fa-solid fa-i-cursor"></i>
            <span class="tool-dot"></span>
        </button>

        <button onclick="setTool('pen')" id="tool-pen" class="dock-btn" title="ปากกาเซ็นชื่อ/เขียนโน้ต">
            <i class="fa-solid fa-pen-nib"></i>
        </button>

        <button onclick="setTool('highlighter')" id="tool-highlighter" class="dock-btn" title="ปากกาไฮไลต์เรืองแสง">
            <i class="fa-solid fa-highlighter"></i>
        </button>

        <button onclick="setTool('eraser')" id="tool-eraser" class="dock-btn" title="ยางลบเส้นวาด">
            <i class="fa-solid fa-eraser"></i>
        </button>

        <button onclick="openSignatureModal()" id="tool-signature" class="dock-btn" title="เซ็นลายเซ็นสด / แปะรูปตราประทับ">
            <i class="fa-solid fa-signature"></i>
        </button>

        <div class="dock-divider"></div>

        <div class="color-dock-group">
            <div class="color-circle active" data-color="#0033aa" style="background: #0033aa;" title="สีน้ำเงินเซ็นต์เอกสาร" onclick="selectInkColor('#0033aa', this)"></div>
            <div class="color-circle" data-color="#111827" style="background: #111827;" title="สีดำทางการ" onclick="selectInkColor('#111827', this)"></div>
            <div class="color-circle" data-color="#ef4444" style="background: #ef4444;" title="สีแดงตรวจแก้" onclick="selectInkColor('#ef4444', this)"></div>
            <div class="color-circle" data-color="#facc15" style="background: #facc15;" title="สีเหลืองไฮไลต์" onclick="selectInkColor('#facc15', this)"></div>
        </div>

        <div class="dock-divider"></div>

        <button onclick="undoLastAction()" class="dock-btn" title="ย้อนกลับ (Undo)">
            <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button onclick="zoomDoc(0.15)" class="dock-btn" title="ขยาย">
            <i class="fa-solid fa-magnifying-glass-plus"></i>
        </button>
        <button onclick="zoomDoc(-0.15)" class="dock-btn" title="ย่อ">
            <i class="fa-solid fa-magnifying-glass-minus"></i>
        </button>
    </nav>

    <div id="sig-modal" class="modal-backdrop" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fa-solid fa-signature text-glow"></i> แปะลายเซ็นหรือตราประทับ</h3>
                <button onclick="closeSignatureModal()" class="btn-close">&times;</button>
            </div>
            <div class="modal-tabs">
                <button id="tab-draw" class="active" onclick="switchSigTab('draw')">วาดลายเซ็นสด</button>
                <button id="tab-upload" onclick="switchSigTab('upload')">อัปโหลดรูปภาพ PNG</button>
            </div>
            <div class="modal-body">
                <div id="pane-draw">
                    <canvas id="sig-canvas" width="400" height="180"></canvas>
                    <div class="sig-tools">
                        <button onclick="clearSigCanvas()" class="btn-mini"><i class="fa-solid fa-trash-can"></i> ล้าง</button>
                        <div class="sig-color-pick">
                            <span class="dot-pick" style="background:#0033aa" onclick="setSigInkColor('#0033aa')"></span>
                            <span class="dot-pick" style="background:#000000" onclick="setSigInkColor('#000000')"></span>
                        </div>
                    </div>
                </div>
                <div id="pane-upload" style="display: none;">
                    <div class="drop-zone" onclick="document.getElementById('sig-image-file').click()">
                        <i class="fa-solid fa-image" style="font-size: 32px; color: var(--accent);"></i>
                        <p>แตะเพื่อเลือกไฟล์รูปภาพโปร่งใส PNG / JPG</p>
                        <input type="file" id="sig-image-file" accept="image/*" style="display:none;" onchange="handleSigUpload(event)">
                    </div>
                    <div id="preview-upload-box" style="display:none; text-align:center; margin-top: 10px;">
                        <img id="img-preview" style="max-height: 120px; border-radius: 6px;">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeSignatureModal()" class="btn-cancel">ยกเลิก</button>
                <button onclick="placeSignatureOnDoc()" class="btn-primary">วางลงบนเอกสาร</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

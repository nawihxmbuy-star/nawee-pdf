<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nawee PDF & Word Pro Studio</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        .ai-sidebar-footer {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px;
            background: #1e293b;
            position: relative;
        }
        .ai-sidebar-footer #ai-input {
            flex: 1;
        }
        .ai-chat-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .btn-attach-doc {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
        }
        .btn-attach-doc:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
        }
        .btn-media-plus {
            background: #22d3ee;
            color: #0f172a;
            font-size: 20px;
            font-weight: bold;
            line-height: 1;
        }
        .btn-media-plus:hover {
            background: #06b6d4;
            transform: scale(1.05);
        }
        .media-popup {
            position: absolute;
            bottom: 55px;
            left: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            padding: 6px;
            z-index: 1000;
            min-width: 155px;
            animation: popSlideUp 0.15s ease-out;
        }
        @keyframes popSlideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .media-popup button {
            background: transparent;
            color: #e2e8f0;
            border: none;
            padding: 8px 12px;
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
            width: 100%;
        }
        .media-popup button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #22d3ee;
        }
        .ai-preview-item {
            position: relative;
            display: inline-block;
        }
        .ai-preview-item .remove-preview-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body class="mode-pdf"> 
    <header class="top-bar">
        <div class="brand">
            <i class="fa-solid fa-file-invoice text-glow"></i>
            <span id="app-title">PDF Pro <small class="badge">PDF MODE</small></span>
        </div>
        <div class="action-group">
            <button onclick="resetApp()" title="ล้างหน้าจอเพื่อเริ่มงานใหม่" style="background: rgba(239, 68, 68, 0.08); color: #f87171;">
                <i class="fa-solid fa-square-plus"></i> <span class="lbl">งานใหม่</span>
            </button>
            <button onclick="document.getElementById('upload').click()" title="เปิดไฟล์ PDF"><i class="fa-solid fa-folder-open"></i> <span class="lbl">เปิดไฟล์</span></button>
            <button onclick="saveToDatabase()" title="บันทึกลงฐานข้อมูลตรงๆ ไม่ดาวน์โหลด"><i class="fa-solid fa-floppy-disk"></i> <span class="lbl">เซฟไฟล์</span></button>
            <button onclick="shareToLine()" title="แชร์ผ่าน LINE" class="btn-line"><i class="fa-brands fa-line"></i> <span class="lbl">แชร์ LINE</span></button>
            
            <div class="dropdown-wrapper">
                <button onclick="toggleDropdown('convert-menu')" class="btn-premium" title="เมนูแปลงไฟล์"><i class="fa-solid fa-arrows-rotate"></i> <span class="lbl">แปลงไฟล์</span></button>
                <div id="convert-menu" class="dropdown-popup">
                    <button onclick="triggerPdfToWord()"><i class="fa-solid fa-file-word" style="color: #2b579a;"></i> แปลงไฟล์ PDF เป็น Word</button>
                    <button onclick="triggerWordToPdf()"><i class="fa-solid fa-file-pdf" style="color: #e44d26;"></i> แปลงไฟล์ Word เป็น PDF</button>
                    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 4px 0;">
                    <button onclick="exportToPDFFile()"><i class="fa-solid fa-download"></i> ดาวน์โหลดไฟล์ PDF </button>
                </div>
            </div>

            <button onclick="toggleAiSidebar()" class="btn-ai" title="เปิดผู้ช่วย AI อัจฉริยะ" style="background: rgba(34, 211, 238, 0.15); border: 1px solid var(--accent-color, #22d3ee); color: #fff; cursor: pointer; padding: 8px 14px; border-radius: 8px;">
                <i class="fa-solid fa-wand-magic-sparkles" style="color: #22d3ee;"></i> 
                <span class="lbl">ผู้ช่วย AI</span>
            </button>
        </div>
    </header>

    <div class="word-formatting-bar">
        <div class="format-group">
            <button onclick="formatWord('bold')" title="ตัวหนา"><i class="fa-solid fa-bold"></i></button>
            <button onclick="formatWord('italic')" title="ตัวเอียง"><i class="fa-solid fa-italic"></i></button>
            <button onclick="formatWord('underline')" title="ขีดเส้นใต้"><i class="fa-solid fa-underline"></i></button>
        </div>
        <div class="divider"></div>
        <div class="format-group text-size-selector">
            <label>ขนาดฟอนต์แก้ไขหลัก:</label>
            <select onchange="formatWord('fontSize', this.value)">
                <option value="3">ปกติ</option>
                <option value="1">เล็กสุด</option>
                <option value="2">เล็ก</option>
                <option value="4">กลาง</option>
                <option value="5">ใหญ่</option>
                <option value="6">ใหญ่พิเศษ</option>
            </select>
        </div>
    </div>

    <input type="file" id="upload" accept="application/pdf" style="display:none;">

    <main class="workspace">
        <div id="pdf-container">
            <div class="initial-notice">
                <p><i class="fa-solid fa-cloud-arrow-up" style="font-size: 48px; color: var(--accent-color); margin-bottom: 15px;"></i></p>
                <p>ยินดีต้อนรับสู่ระบบกรุณากดปุ่ม <b>"เปิดไฟล์"</b> ด้านบนเพื่อเริ่มต้นทำงานค่ะ</p>
            </div>
        </div>
    </main>

    <div id="pen-settings-panel" class="pen-sub-panel">
        <div id="pen-color-group" class="panel-item">
            <label><i class="fa-solid fa-palette"></i> สีปากกา:</label>
            <input type="color" id="color-picker" value="#22d3ee">
            <div class="quick-color-palette">
                <div class="color-palette-dot pen-palette-dot" data-color="#000000" style="background: #000000;" title="สีดำ"></div>
                <div class="color-palette-dot pen-palette-dot" data-color="#ff0000" style="background: #ff0000;" title="สีแดง"></div>
                <div class="color-palette-dot pen-palette-dot" data-color="#0000ff" style="background: #0000ff;" title="สีน้ำเงิน"></div>
                <div class="color-palette-dot pen-palette-dot" data-color="#00ff00" style="background: #00ff00;" title="สีเขียว"></div>
                <div class="color-palette-dot pen-palette-dot" data-color="#ffff00" style="background: #ffff00;" title="สีเหลือง"></div>
            </div>
        </div>
        <div class="panel-item">
            <label><i class="fa-solid fa-paint-brush"></i> ขนาดปลาย: <span id="brush-size-val">6px</span></label>
            <input type="range" id="brush-size-slider" min="2" max="30" value="6">
            <div class="brush-preview-box">
                <div id="brush-preview"></div>
            </div>
        </div>
        <button onclick="toggleEraserShape()" id="btn-toggle-shape" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; display: none;">สลับทรงยางลบ</button>
    </div>

    <div id="text-settings-panel" class="pen-sub-panel">
        <div class="panel-item">
            <label><i class="fa-solid fa-palette"></i> สีข้อความลอย:</label>
            <input type="color" id="text-color-picker" value="#f59e0b">
            <div class="quick-color-palette">
                <div class="color-palette-dot text-palette-dot" data-color="#000000" style="background: #000000;" title="สีดำ"></div>
                <div class="color-palette-dot text-palette-dot" data-color="#ff0000" style="background: #ff0000;" title="สีแดง"></div>
                <div class="color-palette-dot text-palette-dot" data-color="#0000ff" style="background: #0000ff;" title="สีน้ำเงิน"></div>
                <div class="color-palette-dot text-palette-dot" data-color="#00ff00" style="background: #00ff00;" title="สีเขียว"></div>
                <div class="color-palette-dot text-palette-dot" data-color="#ffff00" style="background: #ffff00;" title="สีเหลือง"></div>
            </div>
        </div>
        <div class="panel-item">
            <label><i class="fa-solid fa-text-height"></i> ขนาดฟอนต์ลอย: <span id="text-size-val">24px</span></label>
            <input type="range" id="text-size-slider" min="12" max="72" value="24">
        </div>
    </div>

    <nav class="toolbar">
        <button onclick="scrollWorkspace('prev')" id="tool-prev" class="nav-btn" title="เลื่อนขึ้นหน้าบน"><i class="fa-solid fa-circle-chevron-left"></i></button>
        <div class="divider"></div>
        
        <button onclick="undoAction()" id="tool-undo" class="nav-btn-action" title="ย้อนกลับการวาดเขียน (Undo)"><i class="fa-solid fa-rotate-left"></i></button>
        <button onclick="redoAction()" id="tool-redo" class="nav-btn-action" title="ทำซ้ำการวาดเขียน (Redo)"><i class="fa-solid fa-rotate-right"></i></button>
        <button onclick="clearCurrentDrawings()" id="tool-clear" class="nav-btn-action" title="ล้างหน้าวาดนี้" style="color: #ef4444;"><i class="fa-solid fa-trash-can"></i></button>
        <div class="divider"></div>
        
        <button onclick="setTool('pan')" id="tool-pan" class="tool-btn active" title="โหมดเลื่อนดูงาน"><i class="fa-solid fa-hand"></i></button>
        <button onclick="setTool('pen')" id="tool-pen" class="tool-btn" title="ปากกาวาดเขียน"><i class="fa-solid fa-pen-fancy"></i></button>
        <button onclick="setTool('text')" id="tool-text" class="tool-btn" title="พิมพ์ข้อความลอย"><i class="fa-solid fa-font"></i></button>
        <button onclick="setTool('eraser')" id="tool-eraser" class="tool-btn" title="ยางลบ"><i class="fa-solid fa-eraser"></i></button>
        
        <div class="divider"></div>
        <button onclick="zoomIn()" title="ขยาย"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button onclick="zoomOut()" title="ย่อ"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <div class="divider"></div>
        <button onclick="scrollWorkspace('next')" id="tool-next" class="nav-btn" title="เลื่อนลงหน้าล่าง"><i class="fa-solid fa-circle-chevron-right"></i></button>
    </nav>

    <div id="ai-sidebar" class="ai-sidebar">
        <div class="ai-sidebar-header">
            <h3><i class="fa-solid fa-wand-magic-sparkles" style="color: #22d3ee;"></i> Studio AI Assistant</h3>
            <button onclick="toggleAiSidebar()" class="close-sidebar-btn">&times;</button>
        </div>
        <div class="ai-sidebar-body">
            <div class="api-key-container">
                <label for="ai-api-key"><i class="fa-solid fa-key" style="color: #f59e0b;"></i> Gemini API Key ของคุณนาวี:</label>
                <input type="password" id="ai-api-key" placeholder="วาง API Key จาก AI Studio ที่นี่...">
            </div>
            <hr class="ai-divider">
            <div class="ai-quick-actions">
                <button onclick="askAiToSummary()" class="btn-ai-action"><i class="fa-solid fa-file-invoice"></i> ⚡ สรุปตาราง/เนื้อหาหน้านี้</button>
            </div>
            <div class="ai-chat-box" id="ai-chat-box">
                <div class="ai-message system-msg">สวัสดีค่ะคุณนาวี! ให้หนูช่วยสรุปรายงาน วิเคราะห์ตาราง หรือแปลความหมายข้อมูลในหน้าเอกสารปัจจุบัน พิมพ์บอกได้เลยนะคะ 📝</div>
            </div>
        </div>

        <div id="file-preview-container" style="padding: 8px 12px; display: flex; gap: 10px; background: rgba(15, 23, 42, 0.6); border-top: 1px solid rgba(255,255,255,0.05); display: none;"></div>

        <div class="ai-sidebar-footer">
            <input type="file" id="ai-document-input" accept=".pdf, .txt, .csv, .doc, .docx" style="display: none;" onchange="handleFileSelect('document')">
            <button type="button" class="ai-chat-btn btn-attach-doc" onclick="document.getElementById('ai-document-input').click()" title="แนบไฟล์เอกสาร"><i class="fa-solid fa-paperclip"></i></button>

            <div class="media-menu-container" style="position: relative; display: inline-block;">
                <button type="button" id="btn-media-plus" class="ai-chat-btn btn-media-plus" onclick="toggleMediaPopup()" title="เพิ่มรูปภาพหรือวิดีโอ">+</button>
                
                <div id="media-popup" class="media-popup" style="display: none;">
                    <button type="button" onclick="triggerMediaInput('image')"><i class="fa-solid fa-image" style="color: #38bdf8;"></i> อัปโหลดรูปภาพ</button>
                    <button type="button" onclick="triggerMediaInput('video')"><i class="fa-solid fa-video" style="color: #c084fc;"></i> อัปโหลดวิดีโอ</button>
                </div>
            </div>

            <input type="file" id="ai-image-input" accept="image/*" style="display: none;" onchange="handleFileSelect('image')">
            <input type="file" id="ai-video-input" accept="video/*" style="display: none;" onchange="handleFileSelect('video')">

            <input type="text" id="ai-input" placeholder="พิมพ์ถาม AI เกี่ยวกับเอกสารนี้..." onkeydown="if(event.key === 'Enter') sendAiQuestion()">
            <button onclick="sendAiQuestion()" title="ส่งคำสั่ง"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="text-node-bottom-bar" class="text-node-floating-bar">
        <div class="floating-bar-content" style="display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="bar-title"><i class="fa-solid fa-font text-glow"></i> ปรับแต่งข้อความลอย</span>
                <button onclick="closeTextSheet()" class="btn-confirm-node" style="background: var(--accent-color); color: #0f172a; width: auto; padding: 6px 14px; font-size: 13px; font-weight: bold; gap: 4px; display: flex; align-items: center; border-radius: 10px; border: none; cursor: pointer;">
                    <i class="fa-solid fa-circle-check"></i> ยืนยันตำแหน่ง
                </button>
            </div>
            <div class="text-node-controls" style="background: rgba(255,255,255,0.02); padding: 10px; border-radius: 12px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;">
                <input type="color" id="floating-text-color" title="เปลี่ยนสีตัวอักษร" style="width: 34px; height: 34px; border: none; background: transparent; cursor: pointer; padding: 0; flex-shrink: 0;">
                
                <div class="quick-color-palette" style="margin-right: 4px;">
                    <div class="color-palette-dot text-palette-dot" data-color="#000000" style="background: #000000;" title="สีดำ"></div>
                    <div class="color-palette-dot text-palette-dot" data-color="#ff0000" style="background: #ff0000;" title="สีแดง"></div>
                    <div class="color-palette-dot text-palette-dot" data-color="#0000ff" style="background: #0000ff;" title="สีน้ำเงิน"></div>
                    <div class="color-palette-dot text-palette-dot" data-color="#00ff00" style="background: #00ff00;" title="สีเขียว"></div>
                    <div class="color-palette-dot text-palette-dot" data-color="#ffff00" style="background: #ffff00;" title="สีเหลือง"></div>
                </div>

                <div style="width: 1px; height: 30px; background: rgba(255,255,255,0.15);"></div>
                <button onclick="formatWord('bold')" title="ตัวหนา" style="background: rgba(255,255,255,0.05); color: #fff; width: 36px; height: 36px; border-radius: 8px;"><i class="fa-solid fa-bold"></i></button>
                <button onclick="formatWord('italic')" title="ตัวเอียง" style="background: rgba(255,255,255,0.05); color: #fff; width: 36px; height: 36px; border-radius: 8px;"><i class="fa-solid fa-italic"></i></button>
                <button onclick="formatWord('underline')" title="ขีดเส้นใต้" style="background: rgba(255,255,255,0.05); color: #fff; width: 36px; height: 36px; border-radius: 8px;"><i class="fa-solid fa-underline"></i></button>
                <div style="width: 1px; height: 30px; background: rgba(255,255,255,0.15);"></div>
                <button onclick="changeActiveNodeSize(2)" title="ขยายขนาดฟอนต์" style="background: rgba(34, 211, 238, 0.1); color: var(--accent-color); width: 36px; height: 36px; border-radius: 8px;"><i class="fa-solid fa-square-plus"></i></button>
                <button onclick="changeActiveNodeSize(-2)" title="ย่อขนาดฟอนต์" style="background: rgba(34, 211, 238, 0.1); color: var(--accent-color); width: 36px; height: 36px; border-radius: 8px;"><i class="fa-solid fa-square-minus"></i></button>
                <div style="width: 1px; height: 30px; background: rgba(255,255,255,0.15);"></div>
                <button onclick="deleteActiveTextNode()" class="btn-delete-node" title="ลบข้อความชิ้นนี้" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; width: 36px; height: 36px; border-radius: 8px;"><i class="fa-solid fa-trash-can"></i></button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
